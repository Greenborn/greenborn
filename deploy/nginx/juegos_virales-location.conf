# Bloque para el server de greenborn.com.ar (listen 443) que sirve /var/www/greenborn.com.ar/dist.
# Insertar ANTES de "location @rewrite_url {". Evita que rutas inexistentes bajo /juegos_virales/
# caigan en el fallback a index.php (que no existe en un sitio estático y produce 500 por bucle).
# Aplicado en el servidor el 2026-11-27. Después: nginx -t && systemctl reload nginx
location /juegos_virales/ {
    try_files $uri $uri/ =404;
}
